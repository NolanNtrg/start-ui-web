when:
  - event: pull_request
    branch: [main]
  - event: manual

services:
  postgres:
    image: postgres:16.1
    environment:
      POSTGRES_PASSWORD: startui
      POSTGRES_USER: startui
      POSTGRES_DB: startui

  maildev:
    image: maildev/maildev:2.2.1

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z-cpuv1
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    commands:
      - minio server /data --console-address :9001

steps:
  - name: e2e
    image: mcr.microsoft.com/playwright:v1.58.0-noble
    environment:
      TMPDIR: /tmp
      VITE_BASE_URL: http://localhost:3000
      VITE_ENV_NAME: tests
      DATABASE_URL: postgres://startui:startui@postgres:5432/startui
      VITE_IS_DEMO: false
      AUTH_SECRET: fyXjLxjXJowjicI2BAjxOaUsQd1QafdegZDciJE/xM8=
      EMAIL_SERVER: smtp://username:password@maildev:1025
      EMAIL_FROM: Start UI <noreply@example.com>
      S3_HOST: minio:9000
      S3_BUCKET_NAME: default
      S3_ACCESS_KEY_ID: startui-access-key
      S3_SECRET_ACCESS_KEY: startui-secret-key
      S3_SECURE: false
      S3_FORCE_PATH_STYLE: true
      DOCKER_MINIO_USERNAME: minioadmin
      DOCKER_MINIO_PASSWORD: minioadmin
      VITE_S3_BUCKET_PUBLIC_URL: http://minio:9000/default
    commands:
      - git config --global --add safe.directory "$CI_WORKSPACE"
      - corepack enable
      - corepack prepare pnpm@10.33.2 --activate
      - pnpm config set store-dir ~/.pnpm-store
      - pnpm install
      - |
        echo "Waiting for postgres..."
        until bash -c "echo > /dev/tcp/postgres/5432" >/dev/null 2>&1; do
          sleep 2
        done
        sleep 3
        echo "Postgres is ready."
      - |
        echo "Waiting for MinIO..."
        until curl -sf http://minio:9000/minio/health/live; do
          sleep 2
        done
        echo "MinIO is ready."
      - |
        curl -sSL https://dl.min.io/client/mc/release/linux-amd64/mc -o /usr/local/bin/mc
        chmod +x /usr/local/bin/mc
        mc alias set minio http://minio:9000 minioadmin minioadmin
        mc admin user add minio $S3_ACCESS_KEY_ID $S3_SECRET_ACCESS_KEY
        mc admin policy attach minio readwrite --user $S3_ACCESS_KEY_ID
        mc mb --ignore-existing minio/$S3_BUCKET_NAME
        mc anonymous set download minio/$S3_BUCKET_NAME
      - pnpm db:push
      - pnpm db:seed
      - pnpm e2e
